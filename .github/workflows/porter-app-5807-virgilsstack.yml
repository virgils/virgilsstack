"on":
    push:
        branches:
            - porter-test
name: Deploy to virgilsstack
jobs:
    porter-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set Github tag
              id: vars
              run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
            - name: Setup porter
              uses: porter-dev/setup-porter@v0.1.0
            - name: Deploy stack
              timeout-minutes: 30
              run: porter apply
              env:
                PORTER_APP_NAME: virgilsstack
                PORTER_CLUSTER: "5807"
                PORTER_DEPLOYMENT_TARGET_ID: 7e591c7d-6aa9-44d7-9ab7-7ac9b4930f80
                PORTER_HOST: https://dashboard.porter.run
                PORTER_PROJECT: "19257"
                PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
                PORTER_TOKEN: ${{ secrets.PORTER_APP_19257_17475 }}
